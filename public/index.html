<style>

}

if(app&&k==='install'){const cp=$('#cp');if(cp&&!$('#cpm')){const s=document.createElement('p');s.id='cpm';s.className='copy-feedback';s.setAttribute('role','status');s.setAttribute('aria-live','polite');cp.insertAdjacentElement('afterend',s)}}
if(app){const f=PA.flatMap(g=>g[2]).find(p=>p[0]===k);$('#tt').textContent=f?x(f[1],f[2]):'';$('#sd')?.classList.remove('o');$('#sc')?.classList.remove('o')}

$$('.split').forEach(e=>{e.innerHTML=e.textContent.split(' ').map(w=>`<span class="w"><span>${w}</span></span>`).join(' ');if(MO)gsap.from($$('.w>span',e),{yPercent:115,duration:1.1,ease:'expo.out',stagger:.06,delay:.15})});
